name: Keep Supabase Database Active

on:
  schedule:
    # Runs every 2 days at 05:00 UTC (1 hour prior to Supabase's 06:00 UTC daily pause check)
    - cron: '0 5 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

jobs:
  keep-alive:
    name: Ping Supabase Database & Cloud Backend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Live Render Cloud Backend
        run: |
          echo "Pinging Live Backend on Render (https://enterprise-document-intelligence-lnle.onrender.com/health)..."
          RENDER_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://enterprise-document-intelligence-lnle.onrender.com/health" || true)
          echo "Render Backend HTTP Status: $RENDER_STATUS"

      - name: Query Supabase Authenticated REST API
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Querying Supabase PostgREST API (aeseryhjqjcsxprrmoib)..."
          KEY="${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlc2VyeWhqcWpjc3hwcnJtb2liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2ODY5MjEsImV4cCI6MjEwNzI2MjkyMX0.llddaay_fTDxfhAgT5IhEvhaL_tMwLsc-DX1Q0r_2T8}"
          HTTP_STATUS=$(curl -s -o /tmp/rest_resp.json -w "%{http_code}" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "https://aeseryhjqjcsxprrmoib.supabase.co/rest/v1/organizations?select=id,name&limit=1")
          echo "Supabase REST API HTTP Status: $HTTP_STATUS"
          cat /tmp/rest_resp.json || true
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Successfully registered active database usage with Supabase PostgREST!"
          else
            echo "Warning: REST API returned HTTP $HTTP_STATUS"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install asyncpg
        run: pip install asyncpg

      - name: Execute Keep-Alive SQL Transaction
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python - << 'EOF'
          import os, sys, asyncio, asyncpg

          db_url = os.environ.get("SUPABASE_DB_URL")
          if not db_url:
              print("Notice: SUPABASE_DB_URL secret not set. The REST Gateway query above already registered activity.")
              sys.exit(0)

          async def run_query():
              print("Connecting to Supabase PostgreSQL pooler...")
              clean_url = db_url.replace("postgresql+asyncpg://", "postgresql://")
              conn = await asyncpg.connect(clean_url, statement_cache_size=0)
              val = await conn.fetchval("SELECT 1")
              print(f"Direct query executed successfully! Result: {val}")
              await conn.execute("UPDATE organizations SET updated_at = NOW() WHERE id IS NOT NULL")
              print("Database updated_at timestamp touched successfully.")
              await conn.close()

          asyncio.run(run_query())
          EOF
